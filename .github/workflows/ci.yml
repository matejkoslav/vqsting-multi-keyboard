name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: Smatanova/VQSTing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Smatanova/VQSTing/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python tests/smoke_test.py
