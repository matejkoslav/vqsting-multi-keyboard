<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.2/css/fontawesome.min.css" integrity="sha384-BY+fdrpOd3gfeRvTSMT+VUZmA728cfF9Z2G42xpaRkUGu2i3DyzpTURDo5A6CaLK" crossorigin="anonymous">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,600;0,700;1,400&family=Roboto:wght@400;700&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/static/style.css">

    <title>Test</title>
</head>
<body>
  <div class="container mt-5">
    <form id="myForm" method="POST">
        <div class="offset-md-3 col-md-6 mt-5">    
            <div style="width: max-content; margin: auto;">
              <div style="margin: 4.5rem 0; font-size: 1.4rem; font-weight: 500;">
                Sequence no.: {{current}}
              </div>
                <div>
                    <label class="choose col-12 col-sm-5">
                        <input type="radio" id="rating-5" name="value" value="5">
                        <span class="checkmark checkmark_rating">5 - {{scale[1]}}</span>
                      </label>
                </div>
                <div>
                    <label class="choose col-12 col-sm-5">
                        <input type="radio" id="rating-4" name="value" value="4">
                        <span class="checkmark checkmark_rating">4 - {{scale[2]}}</span>
                      </label>
                </div>
                <div>
                    <label class="choose col-12 col-sm-5">
                        <input type="radio" id="rating-3" name="value" value="3">
                        <span class="checkmark checkmark_rating">3 - {{scale[3]}}</span>
                      </label>
                </div>
                <div>
                    <label class="choose col-12 col-sm-5">
                        <input type="radio" id="rating-2" name="value" value="2">
                        <span class="checkmark checkmark_rating">2 - {{scale[4]}}</span>
                      </label>
                </div>
                <div>
                    <label class="choose col-12 col-sm-5">
                        <input type="radio" id="rating-1" name="value" value="1">
                        <span class="checkmark checkmark_rating">1 - {{scale[5]}}</span>
                      </label>
                </div>
              </div>

        </div>
      </form>
</div>

<script>
  var widthValue = "{{scale[0]}}";
  var elements = document.getElementsByClassName("checkmark_rating");
  for(var i = 0; i < elements.length; i++) {
      elements[i].style.width = widthValue;
  }
  
  document.addEventListener("DOMContentLoaded", function() {
      setTimeout(function() {
          var form = document.getElementById('myForm');
          form.submit();
      }, 9000); 
  });

  document.addEventListener("keydown", function(event) {
    const key = event.key;
    if (key >= "1" && key <= "5") {
      const elementId = `rating-${key}`;
      const element = document.getElementById(elementId);
      if (element) {
        element.checked = true;
      }
    }
  });
</script>

<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
    
</body>
</html>
