{% extends "base.html" %}
{% block title %}Create account{% endblock %}

{% block content %}

<div class="container mb-5">
  <h1 class="text-center mt-5">
    Create account
  </h1>
  <form method="POST">
    <div class="offset-md-4 col-md-4 mt-5">
      <!-- <div style="width: max-content; margin: auto;">
        <label class="choose col-12 col-sm-5">
          <input type="radio" name="role" value="1" checked>
          <span class="checkmark">Participant</span>
        </label>
        <label class="choose col-12 col-sm-5">
          <input type="radio" name="role" value="10">
          <span class="checkmark">Specialist</span>
        </label>
      </div> -->
      <input type="hidden" name="role" value="{{role}}">
      <div class="form-group mt-1">
        <label for="username">Username</label>
        <input type="text" class="form-control" id="username" name="username">
      </div>
      <div class="form-group mt-1">
        <label for="password">Password</label>
        <input type="password" class="form-control" id="password" name="password">
      </div>
      <div class="form-group mt-1">
        <label for="confirm_password">Confirm password</label>
        <input type="password" class="form-control" id="confirm_password" name="confirm_password">
      </div>
      <button type="submit" class="btn btn-primary mt-3">Create account</button>
    </div>
  </form>

</div>


{% endblock %}
