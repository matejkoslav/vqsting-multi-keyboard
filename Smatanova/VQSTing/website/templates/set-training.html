{% extends "base.html" %}
{% block title %}Set training{% endblock %}

{% block content %}
      
<div class="container mb-5">
    <h1 class="text-center mt-5">
        Training sequences
    </h1>

    <form method="post">
        <table class="m-4">
            {% for training in session.trainings %}
            <tr class="mt-2">
                <td style="font-weight: 500;" class="p-3">
                    {{training.name}}
                </td>
                <td class="p-3">
                    Min value: 
                    <select class="form-select" style="width: 4rem; display: inline;" name="min_{{training.id}}" id="min_{{training.id}}">
                        <option selected>{{training.min}}</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                      </select>
                </td>
                <td class="p-3">
                    Max value: 
                    <select class="form-select" style="width: 4rem; display: inline;" name="max_{{training.id}}" id="max_{{training.id}}">
                        <option selected>{{training.max}}</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                      </select>
                </td>
                {% if session.test_method == "dcr" %}
                <td>
                    <div class="form-check">                         
                        <label class="form-check-label" for="reference">
                            <input class="form-check-input" type="radio" value="reference_{{training.id}}" id="reference_{{training.id}}" name="reference" {% if training.ref %} checked {% endif %}>
                            Reference
                        </label>                        
                    </div>
                </td>
                {% endif %}
            </tr>
            {% endfor %}
        </table>
        <div class="ms-4">
            <button type="submit" class="btn btn-primary m-1">Save</button>
        </div>
    </form>
    
</div>

{% endblock %}
