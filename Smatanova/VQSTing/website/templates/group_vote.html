<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="/static/style.css">

    <title>Vote</title>

    <style>
        html, body { height: 100%; }
        body { margin: 0; background: #f4f6f8; }

        .vote-wrap { height: 100vh; display: flex; flex-direction: column; padding: 18px 22px 14px; }

        .vote-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
        .vote-head h1 { font-size: 1.6rem; font-weight: 600; margin: 0; }
        .vote-head .sub { color: #6b7785; font-size: 0.95rem; }
        .vote-head .clock { display: flex; align-items: baseline; gap: 10px; color: #6b7785; }
        .vote-head .clock b { font-size: 2.4rem; line-height: 1; color: #1c2530; font-variant-numeric: tabular-nums; }
        .vote-head .clock.low b { color: #b3261e; }

        /* one column per tester, stretched to the full screen height */
        .vote-cols { flex: 1; display: grid; gap: 16px; grid-auto-flow: column;
                     grid-auto-columns: minmax(0, 1fr); min-height: 0; }

        .vote-col { display: flex; flex-direction: column; align-items: center; justify-content: center;
                    gap: 18px; padding: 24px 16px; text-align: center; min-height: 0;
                    background: #fff; border: 2px solid #d8dde3; border-radius: 14px;
                    transition: background-color .25s, border-color .25s; }
        .vote-col h2 { font-size: 1.8rem; font-weight: 700; margin: 0; color: #1D3364; }
        .vote-col .seat { font-size: 0.85rem; color: #6b7785; }
        .vote-col .dots { font-size: 4rem; line-height: 1; color: #c3cad3; }
        .vote-col .status { font-size: 1.15rem; font-weight: 600; color: #6b7785; }

        /* after rating: only the border turns green, no fill */
        .vote-col.voted { border-color: #1f8a4c; }
        .vote-col.voted .status { color: #1f8a4c; }
        .vote-col.voted .dots { visibility: hidden; }

        /* the scale, small and shared by everybody */
        .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 22px;
                  margin: 0 0 14px; padding: 10px 14px; background: #fff; border: 1px solid #d8dde3;
                  border-radius: 12px; color: #1c2530; font-size: 1.05rem; }
        .legend b { color: #1D3364; }
        .vote-foot { color: #6b7785; font-size: 0.85rem; margin: 6px 0 0; text-align: center; }

    </style>
</head>
<body>
<div class="vote-wrap">
    <div class="vote-head">
        <h1>Video <span id="current">{{ current }}</span> / <span id="total">{{ total }}</span></h1>
        <span class="sub">{{ session.name }} · {{ session.test_method|upper }}</span>
        <span class="clock" id="clock">closes in <b id="countdown">9</b> s</span>
    </div>

    <div class="legend">
        {% for label in labels %}<span><b>{{ 5 - loop.index0 }}</b> {{ label }}</span>{% endfor %}
    </div>

    <div id="columns" class="vote-cols"></div>

    <p class="vote-foot">
        Rate with keys <kbd>1</kbd>–<kbd>5</kbd> on your own keyboard. Only your first key counts.
    </p>
</div>

<form id="nextForm" method="POST" action="{{ url_for('group.next_video', id_session=session.id) }}" class="d-none"></form>

<script>
    // Blind rating: this page never receives the values, only whether a tester
    // has already rated the current video. Voting is by keyboard only (no mouse),
    // so nobody can see what the others picked.
    const stateUrl = "{{ url_for('group.state', id_session=session.id) }}";
    const nextForm = document.getElementById('nextForm');

    let since = 0;
    let finished = false;

    function ensureColumn(tester) {
        let column = document.getElementById(`vote-${tester.id}`);
        if (column) return column;
        column = document.createElement('div');
        column.className = 'vote-col';
        column.id = `vote-${tester.id}`;
        column.dataset.id = tester.id;
        column.innerHTML = `
            <div>
                <h2 data-role="name"></h2>
                <div class="seat" data-role="seat"></div>
            </div>
            <div class="dots">…</div>
            <div class="status" data-role="status"></div>`;
        document.getElementById('columns').append(column);
        return column;
    }

    function render(data) {
        const ids = new Set(data.testers.map(tester => tester.id));
        document.querySelectorAll('#columns [data-id]').forEach(column => {
            if (!ids.has(Number(column.dataset.id))) column.remove();
        });

        for (const tester of data.testers) {
            const column = ensureColumn(tester);
            const name = tester.name || `Tester ${tester.seat}`;
            column.querySelector('[data-role="name"]').textContent = name;
            column.querySelector('[data-role="seat"]').textContent = tester.name ? `Tester ${tester.seat}` : '';
            column.classList.toggle('voted', tester.voted);
            column.querySelector('[data-role="status"]').textContent = tester.voted
                ? `${name} has rated this sequence`
                : 'waiting for rating…';
        }
    }

    let busy = false;
    async function refresh() {
        if (finished || busy) return;
        busy = true;
        let data;
        try {
            const response = await fetch(`${stateUrl}?since=${since}`);
            if (!response.ok) return;
            data = await response.json();
        } catch (error) {
            return;
        } finally {
            busy = false;
        }

        for (const event of data.events) {
            if (event.seq > since) since = event.seq;
        }

        document.getElementById('current').textContent = data.park.current;
        document.getElementById('total').textContent = data.park.total;
        document.getElementById('countdown').textContent = Math.ceil(data.park.seconds_left);
        document.getElementById('clock').classList.toggle('low', data.park.seconds_left < 3);

        if (data.phase === 'finished') {
            finished = true;
            clearInterval(timer);
            window.location = "{{ url_for('group.results', id_session=session.id) }}";
            return;
        }

        render(data);

        if (!data.park.round_open) {
            finished = true;
            clearInterval(timer);
            setTimeout(() => nextForm.submit(), 1000);
        }
    }

    // Windows also delivers the testers' keys to the page itself; ignore them here
    // (the votes come from the keyboard listener).
    document.addEventListener('keydown', event => {
        if (event.ctrlKey || event.altKey || event.metaKey || /^F\d+$/.test(event.key)) return;
        event.preventDefault();
    });

    const timer = setInterval(refresh, 200);
    refresh();
</script>

</body>
</html>
