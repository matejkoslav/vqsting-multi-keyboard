<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="/static/style.css">

    <title>Vote</title>
</head>
<body class="bg-light">
<div class="container-fluid py-3">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">Video <span id="current">{{ current }}</span> / <span id="total">{{ total }}</span></h2>
        <h2 class="mb-0"><span id="countdown">9.0</span> s</h2>
    </div>

    <div id="columns" class="row g-3"></div>

    <p class="text-muted mt-3 mb-0">
        Vote with keys <kbd>1</kbd>–<kbd>5</kbd> on your own keyboard,
        or click a column header and then a number.
    </p>
</div>

<form id="nextForm" method="POST" action="{{ url_for('group.next_video', id_session=session.id) }}" class="d-none"></form>

<script>
    const stateUrl = "{{ url_for('group.state', id_session=session.id) }}";
    const voteUrl = "{{ url_for('group.vote', id_session=session.id) }}";
    const nextForm = document.getElementById('nextForm');

    let since = 0;
    let armed = null;
    let finished = false;

    function ensureColumn(tester, labels) {
        let column = document.getElementById(`vote-${tester.seat}`);
        if (column) return column;

        column = document.createElement('div');
        column.className = 'col-12';
        column.id = `vote-${tester.seat}`;
        column.dataset.seat = tester.seat;

        const rows = labels.map((label, index) => {
            const value = 5 - index;
            return `<button type="button" class="btn btn-outline-dark w-100 mb-1" data-value="${value}">${value} · ${label}</button>`;
        }).join('');

        column.innerHTML = `
        <div class="card">
            <div class="card-header text-center" data-role="head" role="button">
                <h4 class="mb-1">Tester ${tester.seat}</h4>
                <div class="small text-muted" data-role="keyboard"></div>
                <div class="small" data-role="demo"></div>
                <div class="fw-bold text-muted" data-role="status">… waiting</div>
                <div class="small text-primary d-none" data-role="hint">click a number to vote</div>
            </div>
            <div class="card-body p-2">${rows}</div>
        </div>`;

        column.querySelector('[data-role="head"]').addEventListener('click', () => {
            armed = tester.seat;
            updateArm();
        });
        column.querySelectorAll('[data-value]').forEach(button => {
            button.addEventListener('click', () => {
                if (armed !== tester.seat) return;
                vote(tester.seat, Number(button.dataset.value));
            });
        });

        document.getElementById('columns').append(column);
        return column;
    }

    function updateArm() {
        document.querySelectorAll('#columns [data-seat] .card').forEach(card => {
            card.classList.remove('border', 'border-primary', 'border-3');
        });
        if (armed === null) return;
        const column = document.getElementById(`vote-${armed}`);
        if (!column) return;
        column.querySelector('.card').classList.add('border', 'border-primary', 'border-3');
        column.querySelector('[data-role="hint"]').classList.remove('d-none');
    }

    async function vote(seat, value) {
        await fetch(voteUrl, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({seat: seat, value: value})
        });
        refresh();
    }

    function render(data) {
        const labels = data.scale.labels;
        const seats = new Set(data.testers.map(tester => tester.seat));
        document.querySelectorAll('#columns [data-seat]').forEach(column => {
            if (!seats.has(Number(column.dataset.seat))) {
                column.remove();
                if (armed === Number(column.dataset.seat)) armed = null;
            }
        });

        const width = 12 / Math.max(data.testers.length, 1);
        for (const tester of data.testers) {
            const column = ensureColumn(tester, labels);
            column.className = `col-12 col-lg-${width}`;
            column.querySelector('[data-role="keyboard"]').textContent = tester.keyboard_name || 'no keyboard';
            const demographic = [];
            if (tester.age !== null) demographic.push(`${tester.age} years`);
            if (tester.glasses !== null) demographic.push(tester.glasses ? 'glasses' : 'no glasses');
            column.querySelector('[data-role="demo"]').textContent = demographic.join(' · ');
            column.querySelector('[data-role="hint"]').classList.toggle('d-none', armed !== tester.seat);

            const status = column.querySelector('[data-role="status"]');
            if (tester.vote !== null) {
                status.textContent = '✓ voted';
                status.className = 'fw-bold text-success';
            } else {
                status.textContent = '… waiting';
                status.className = 'fw-bold text-muted';
            }
        }
        updateArm();
    }

    async function refresh() {
        if (finished) return;
        const response = await fetch(`${stateUrl}?since=${since}`);
        if (!response.ok) return;
        const data = await response.json();

        for (const event of data.events) {
            if (event.seq > since) since = event.seq;
        }

        document.getElementById('current').textContent = data.park.current;
        document.getElementById('total').textContent = data.park.total;
        document.getElementById('countdown').textContent = data.park.seconds_left.toFixed(1);

        if (data.phase === 'finished') {
            finished = true;
            clearInterval(timer);
            window.location = "{{ url_for('group.results', id_session=session.id) }}";
            return;
        }

        render(data);

        if (!data.park.round_open) {
            finished = true;
            clearInterval(timer);
            setTimeout(() => nextForm.submit(), 1000);
        }
    }

    const timer = setInterval(refresh, 500);
    refresh();
</script>

</body>
</html>
