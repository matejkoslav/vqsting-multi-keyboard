{% extends "base.html" %}
{% block title %}Profile{% endblock %}

{% block content %}

<div class="container mb-5">
  <h1 class="text-center mt-5">
    Profile
  </h1>
  <h2 class="text-center mt-3">
    {{user.username}}
  </h2>
  <form method="POST">
      <div class="offset-md-4 col-md-4 mt-3">
        <div class="" style="width: max-content; margin:auto;">
          <label class="choose col-12 col-sm-5">
            <input type="radio" name="gender" value="m">
            <span class="checkmark">Man</span>
          </label>
          <label class="choose col-12 col-sm-5">
            <input type="radio" name="gender" value="f">
            <span class="checkmark">Woman</span>
          </label>
        </div>

        <div class="form-group mt-1">
          <label for="age">Age</label>
          <input type="number" class="form-control" id="age" name="age">
        </div>

        <div class="mt-4">
          Are you wearing glasses/lens?
        </div>
        <div class="mt-2" style="width: max-content; margin:auto;">
          <label class="choose col-12 col-sm-5">
            <input type="radio" name="glasses" value="True">
            <span class="checkmark">Yes</span>
          </label>
          <label class="choose col-12 col-sm-5">
            <input type="radio" name="glasses" value="False">
            <span class="checkmark">No</span>
          </label>

        </div>
        <div class="d-flex justify-content-center">
          <button type="submit" class="btn btn-primary mt-3">Finish</button>
        </div>
      </div>
  </form>



</div>


{% endblock %}
